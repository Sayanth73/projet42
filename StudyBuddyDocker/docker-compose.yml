services:
  db:
    image: mysql:8.0
    container_name: mysql8-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: soaroot
      MYSQL_DATABASE: studybuddy
      MYSQL_USER: buddy
      MYSQL_PASSWORD: soar
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Mount optional initial SQL schema/scripts:
      # - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  payara:
    image: payara/server-full:latest
    container_name: payara-full
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["--debug"]
    ports:
      - "8080:8080"   # HTTP application listener
      - "8181:8181"   # HTTPS listener
      - "4848:4848"   # Payara Admin Console
      - "9009:9009"   # JVM Remote Debugger (JDWP)
      - "8686:8686"   # JMX remote port (optional, useful for IDE JMX management)
    volumes:
          - ./deployments:/opt/payara/deployments
          - ./libs/mysql-connector-java-8.0.26.jar:/opt/payara/appserver/glassfish/domains/domain1/lib/mysql-connector-j-8.0.33.jar:ro
          - ./config/post-boot-commands.asadmin:/opt/payara/config/post-boot-commands.asadmin:ro
    environment:
          - ADMIN_USER=admin
          - ADMIN_PASSWORD=adminpassword
          - JVM_ARGS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9009

volumes:
  mysql_data:
    driver: local